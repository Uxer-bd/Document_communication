<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document - Consultation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #ffffff;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60%;
        }
        .btn-download {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #0052a3;
        }
        .viewer-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="title" id="doc-title">Chargement...</div>
        <!-- Le lien et le fichier s'adapteront dynamiquement -->
        <a id="download-btn" href="#" download class="btn-download">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 0 0-.708.708l3 3z"/>
            </svg>
            Télécharger
        </a>
    </header>

    <div class="viewer-container">
        <!-- Affichage dynamique du PDF dans la page -->
        <iframe id="pdf-frame" src="" type="application/pdf"></iframe>
    </div>

    <script>
        // Associez chaque identifiant à son fichier PDF et à son titre
        const documents = {
            "1": { file: "doc-1.pdf", title: "Conditions Générales GIZ" },
            "2": { file: "doc-2.pdf", title: "Guide d'utilisation & Sécurité" },
            "3": { file: "doc-3.pdf", title: "Catalogue / Fiche Technique" }
        };

        // Récupération du paramètre "doc" dans l'URL (ex: ?doc=3)
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('doc') || "1"; // Par défaut, affiche le doc 1 si aucun paramètre

        // Sélection du document correspondant (ou repli sur le doc 1 par sécurité)
        const currentDoc = documents[docId] || documents["1"];

        // Injection dynamique dans votre structure HTML existante
        document.getElementById('pdf-frame').src = currentDoc.file + '#toolbar=0';
        document.getElementById('doc-title').textContent = currentDoc.title;
        document.getElementById('download-btn').href = currentDoc.file;
    </script>

</body>
</html>
